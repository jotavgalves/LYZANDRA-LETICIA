<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Admin Bio · Ly Cílios</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./admin.css?v=1">
</head>
<body>
  <section class="login" id="loginView">
    <form class="login-card" id="loginForm">
      <img class="login-logo" src="../favicon.svg" alt="Ly Cílios">
      <h1>Admin da Bio</h1>
      <p>Use a mesma senha administrativa da landing principal.</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="Senha administrativa" required>
      <button class="btn primary" type="submit">Entrar</button>
      <div class="error" id="loginError"></div>
    </form>
  </section>

  <main class="app hidden" id="adminApp">
    <aside class="panel">
      <header class="panel-head">
        <div class="head-row">
          <div class="head-brand"><img src="../favicon.svg" alt=""><div><strong>Bio · Ly Cílios</strong><span>Painel independente</span></div></div>
          <div class="actions"><button class="btn soft" id="openBio" type="button">Abrir</button><button class="btn dark" id="saveBtn" type="button">Salvar</button></div>
        </div>
        <div class="tabs" id="tabs">
          <button class="tab active" data-tab="geral" type="button">Geral</button>
          <button class="tab" data-tab="imagens" type="button">Imagens</button>
          <button class="tab" data-tab="links" type="button">Links</button>
          <button class="tab" data-tab="marketing" type="button">Pixel & Ads</button>
          <button class="tab" data-tab="visual" type="button">Visual</button>
        </div>
        <div class="status" id="saveStatus">Carregando…</div>
      </header>
      <div class="editor" id="editor"></div>
    </aside>

    <section class="preview"><div class="device"><iframe id="previewFrame" src="../?admin-preview=1" title="Prévia da bio"></iframe></div></section>
  </main>
  <div class="toast hidden" id="toast"></div>
  <script src="../content.js?v=1"></script>
  <script src="./admin.js?v=1"></script>
</body>
</html>
