name: Validate growth suite

on:
  push:
    branches: [main]
    paths:
      - 'assets/premium-experience.css'
      - 'assets/premium-experience.js'
      - 'assets/analytics-runtime.js'
      - 'assets/campaign-runtime.js'
      - 'assets/thank-you.css'
      - 'assets/thank-you.js'
      - 'admin/growth.js'
      - 'admin/scroll-depth.js'
      - 'functions/api/analytics.js'
      - 'bio/attribution.js'
      - 'bio/index.html'
      - 'obrigado.html'
      - 'functions/_middleware.js'
      - 'admin/index.html'
      - '_headers'
      - '.github/workflows/validate-growth.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check assets/premium-experience.js
          node --check assets/analytics-runtime.js
          node --check assets/campaign-runtime.js
          node --check assets/thank-you.js
          node --check admin/growth.js
          node --check admin/scroll-depth.js
          node --check functions/api/analytics.js
          node --check bio/attribution.js
          node --check functions/_middleware.js
      - name: Validate integration
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/premium-experience.css
          test -s assets/premium-experience.js
          test -s assets/analytics-runtime.js
          test -s assets/campaign-runtime.js
          test -s functions/api/analytics.js
          test -s obrigado.html
          grep -Fq 'premium-experience.css?v=1' functions/_middleware.js
          grep -Fq 'analytics-runtime.js?v=1' functions/_middleware.js
          grep -Fq 'campaign-runtime.js?v=1' functions/_middleware.js
          grep -Fq 'public-hardening.js?v=2' functions/_middleware.js
          grep -Fq 'fetchpriority' functions/_middleware.js
          grep -Fq '/admin/growth.js?v=1' admin/index.html
          grep -Fq '/admin/scroll-depth.js?v=1' admin/index.html
          grep -Fq 'Crescimento & Funil' admin/growth.js
          grep -Fq 'Profundidade de scroll' admin/scroll-depth.js
          grep -Fq 'countdownEnabled' assets/campaign-runtime.js
          grep -Fq 'scroll_75' assets/analytics-runtime.js
          grep -Fq 'thankyou_view' functions/api/analytics.js
          grep -Fq 'bio_link' functions/api/analytics.js
          grep -Fq 'instagram-bio' bio/attribution.js
          grep -Fq 'id="tyTitle"' obrigado.html
          grep -Fq 'noindex,nofollow,noarchive' obrigado.html
          grep -Fq '/obrigado.html' _headers
