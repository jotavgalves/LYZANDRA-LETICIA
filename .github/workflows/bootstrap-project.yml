name: Bootstrap project

on:
  push:
    branches: [main]
    paths:
      - '.corebundle/**'
      - '.github/workflows/bootstrap-project.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and validate project
        shell: bash
        run: |
          test -f .corebundle/part-00
          test -f .corebundle/part-01
          test -f .corebundle/part-02
          test -f .corebundle/part-03
          test -f .corebundle/part-04
          test -f .corebundle/part-05
          test -f .corebundle/part-06
          cat .corebundle/part-* > /tmp/project-core.tar.xz.b64
          base64 --decode /tmp/project-core.tar.xz.b64 > /tmp/project-core.tar.xz
          xz -t /tmp/project-core.tar.xz
          tar -xJf /tmp/project-core.tar.xz
          rm -rf .corebundle .bundle project-text.tar.gz.b64

      - name: Commit project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Speed Lash site with editable admin"
          git push
