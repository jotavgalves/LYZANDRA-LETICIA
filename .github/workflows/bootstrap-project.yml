name: Bootstrap project

on:
  push:
    branches: [main]
    paths:
      - 'project-text.tar.gz.b64'
      - '.github/workflows/bootstrap-project.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        shell: bash
        run: |
          if [ ! -f project-text.tar.gz.b64 ]; then
            echo "Bundle already removed; nothing to do."
            exit 0
          fi
          base64 --decode project-text.tar.gz.b64 > /tmp/project-text.tar.gz
          tar -xzf /tmp/project-text.tar.gz
          rm -f project-text.tar.gz.b64

      - name: Commit project files
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish Speed Lash site with editable admin"
          git push
