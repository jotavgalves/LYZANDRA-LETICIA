name: Validate conversion layer

on:
  push:
    branches: [main]
    paths:
      - assets/conversion-runtime.js
      - assets/conversion.css
      - assets/mobile-polish.css
      - assets/mobile-polish.js
      - assets/original.css
      - assets/clone.css
      - assets/full-editor-runtime.js
      - assets/site-runtime.js
      - assets/identity-runtime.js
      - assets/testimonials-runtime.js
      - assets/certificates-runtime.js
      - admin/conversion.js
      - admin/full-editor.js
      - admin/conversion-shortcut.js
      - admin/mobile-sticky-control.js
      - admin/index.html
      - functions/index.js
      - functions/_middleware.js
      - functions/api/full-editor.js
      - images/**
      - index.html
      - .github/workflows/validate-conversion.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check assets/conversion-runtime.js
          node --check assets/mobile-polish.js
          node --check assets/full-editor-runtime.js
          node --check assets/site-runtime.js
          node --check assets/identity-runtime.js
          node --check assets/testimonials-runtime.js
          node --check assets/certificates-runtime.js
          node --check admin/conversion.js
          node --check admin/full-editor.js
          node --check admin/conversion-shortcut.js
          node --check admin/mobile-sticky-control.js
          node --check functions/index.js
          node --check functions/_middleware.js
          node --check functions/api/full-editor.js
      - name: Validate single-pass rendering
        shell: bash
        run: |
          set -euo pipefail
          grep -q '__SITE_CONTENT_SERVER_APPLIED__' functions/index.js
          grep -q '__FULL_EDITOR_PATCHES__' functions/index.js
          grep -q "SITE_CONTENT.get('site-full-editor'" functions/index.js
          grep -q 'data-site-booting' functions/_middleware.js
          grep -q 'site-render-ready' assets/site-runtime.js
          grep -q '__SITE_CONTENT_READY__' assets/site-runtime.js
          grep -q 'autoInitialized' assets/conversion-runtime.js
          grep -q 'autoInitialized' assets/identity-runtime.js
          grep -q 'autoInitialized' assets/testimonials-runtime.js
          grep -q 'autoInitialized' assets/certificates-runtime.js
          grep -q "has('admin-preview')" assets/full-editor-runtime.js
      - name: Validate visual stability fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'section\[data-edit-id="section-001"\]::before' assets/clone.css
          grep -q 'isolation: isolate' assets/clone.css
          grep -q 'conversion-reveal' assets/clone.css
          grep -q 'section\[data-edit-id="section-002"\] article::-webkit-scrollbar' assets/clone.css
          grep -q 'scrollbar-width: none' assets/clone.css
      - name: Validate mobile fidelity
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/mobile-polish.css
          test -s assets/mobile-polish.js
          grep -Fq 'mobile-polish.css?v=2' functions/_middleware.js
          grep -Fq 'mobile-polish.js?v=2' functions/_middleware.js
          grep -q 'data-whatsapp-brand-icon' assets/mobile-polish.js
          grep -q 'sitePlayIcon' assets/mobile-polish.js
          grep -q 'mobile-cta-visible' assets/mobile-polish.js
          grep -q 'mobileStickyCtaEnabled' assets/mobile-polish.js
          grep -q "mobileStickyEnabled = false" assets/mobile-polish.js
          grep -q 'setMobileStickyEnabled' assets/mobile-polish.js
          grep -q 'mobile-sticky-control.js?v=1' admin/conversion-shortcut.js
          grep -q 'mobileStickyCtaEnabled' admin/mobile-sticky-control.js
          grep -q 'Desativado: nenhuma faixa fixa' admin/mobile-sticky-control.js
          grep -q 'safe-area-inset-bottom' assets/mobile-polish.css
          grep -q '#25d366' assets/mobile-polish.css
          grep -q 'overscroll-behavior-y:none' assets/mobile-polish.css
          grep -Fq 'does not change by device' assets/mobile-polish.css
      - name: Validate editable dynamic blocks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'conversion.js?v=3' admin/index.html
          grep -q 'conversion-shortcut.js?v=1' admin/index.html
          grep -q 'Blocos extras' admin/conversion-shortcut.js
          grep -q 'conversionReceiveHeading' assets/conversion-runtime.js
          grep -q 'conversionHeroProof' assets/conversion-runtime.js
          grep -q 'conversionReceiveIcon' assets/conversion-runtime.js
          grep -q 'certificateFinalHeading' assets/certificates-runtime.js
          grep -q 'certificateBenefitText' assets/certificates-runtime.js
          grep -q 'data-icon-name' assets/conversion-runtime.js
          grep -q 'Ícone exibido' admin/full-editor.js
          grep -q 'shield-plus' admin/full-editor.js
      - name: Validate complete editor integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'full-editor-runtime.js' functions/_middleware.js
          grep -q 'full-editor.js' admin/index.html
          grep -q "const KEY = 'site-full-editor'" functions/api/full-editor.js
          grep -q 'isAuthed' functions/api/full-editor.js
          grep -q 'data-full-edit-id' assets/full-editor-runtime.js
          grep -q 'Editor completo do site' admin/full-editor.js
          grep -q '/api/full-editor' admin/full-editor.js
      - name: Validate local optimized assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/original.css
          ! grep -q '@font-face' assets/original.css
          ! grep -q 'lycilios.vercel.app' index.html
          ! grep -q 'lycilios.vercel.app' assets/certificates-runtime.js
          for file in hero-video tec-mega tec-volume-brasileiro tec-molhado certificate lyzandra; do
            test -s "images/$file.webp"
          done
          grep -q '/images/hero-video.webp' index.html
          grep -q '/images/certificate.webp' assets/certificates-runtime.js
