name: Validate editor v4

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'deploy-update.ps1'
      - 'functions/api/health.js'
      - '.github/workflows/validate-editor-v4.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check admin/admin.js
      - name: Validate PowerShell parser
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './deploy-update.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Check no-code editor markers
        shell: bash
        run: |
          grep -q '<meta name="editor-version" content="4">' admin/index.html
          ! grep -Eqi 'CLASSES CSS|CSS INLINE|span-003|Ferramentas técnicas' admin/index.html
          ! grep -Eqi 'overflow-x:auto|width:max-content' admin/admin.css
          grep -q 'Enviar vídeo do computador' admin/admin.js
