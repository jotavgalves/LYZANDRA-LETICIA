name: Validate editor v5

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'assets/site-runtime.js'
      - 'assets/identity-runtime.js'
      - 'assets/testimonials-runtime.js'
      - 'assets/marketing-runtime.js'
      - 'assets/certificates-runtime.js'
      - 'assets/seo-runtime.js'
      - 'src/login-rate-limit.js'
      - 'functions/index.js'
      - 'functions/api/login.js'
      - 'functions/robots.txt.js'
      - 'functions/sitemap.xml.js'
      - 'privacidade.html'
      - 'termos.html'
      - '_headers'
      - '_routes.json'
      - 'deploy-update.ps1'
      - 'functions/api/health.js'
      - '.github/workflows/validate-editor-v5.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check admin/admin.js
          node --check admin/identity.js
          node --check admin/contact.js
          node --check admin/testimonials.js
          node --check admin/testimonials-fix.js
          node --check admin/marketing.js
          node --check admin/certificates.js
          node --check admin/certificates-fit-fix.js
          node --check admin/seo.js
          node --check assets/site-runtime.js
          node --check assets/identity-runtime.js
          node --check assets/testimonials-runtime.js
          node --check assets/marketing-runtime.js
          node --check assets/certificates-runtime.js
          node --check assets/seo-runtime.js
          node --check src/login-rate-limit.js
          node --check functions/index.js
          node --check functions/api/login.js
          node --check functions/robots.txt.js
          node --check functions/sitemap.xml.js
      - name: Validate PowerShell parser
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './deploy-update.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Validate editor architecture
        shell: bash
        run: |
          grep -q '<meta name="editor-version" content="5">' admin/index.html
          grep -q 'noindex,nofollow,noarchive' admin/index.html
          grep -q 'Prévia em tempo real' admin/index.html
          grep -q 'Partes do site' admin/index.html
          grep -q '/admin/identity.js' admin/index.html
          grep -q '/admin/contact.js' admin/index.html
          grep -q '/admin/testimonials.js' admin/index.html
          grep -q '/admin/marketing.js' admin/index.html
          grep -q '/admin/certificates.js' admin/index.html
          grep -q '/admin/seo.js' admin/index.html
          ! grep -Eqi 'CLASSES CSS|CSS INLINE|span-003|Ferramentas técnicas' admin/index.html
          ! grep -Eqi 'overflow-x:auto|width:max-content' admin/admin.css
          grep -q 'YouTube, Vimeo, TikTok, Instagram, Facebook' admin/admin.js
          grep -q 'Logo e identidade visual' admin/identity.js
          grep -q 'Usar a mesma logo principal no rodapé' admin/identity.js
          grep -q 'WhatsApp e contato' admin/contact.js
          grep -q 'Número do WhatsApp' admin/contact.js
          grep -q 'Mensagem que já abre pronta' admin/contact.js
          grep -q 'Botão flutuante' admin/contact.js
          grep -q 'Depoimentos das alunas' admin/testimonials.js
          grep -q 'Imagem ou print do depoimento' admin/testimonials.js
          grep -q 'Story 9:16' admin/testimonials-fix.js
          grep -q 'Marketing, Pixel e Ads' admin/marketing.js
          grep -q 'Checkout externo' admin/marketing.js
          grep -q 'Meta Pixel ID' admin/marketing.js
          grep -q 'Certificado profissional' admin/certificates.js
          grep -q 'Adicionar certificado' admin/certificates.js
          grep -q 'Bloco final de autoridade' admin/certificates.js
          grep -q 'SEO e Google' admin/seo.js
          grep -q 'Google Search Console' admin/seo.js
          grep -q 'Imagem de compartilhamento' admin/seo.js
          grep -q 'a-006' admin/contact.js
          grep -q 'a-005' admin/contact.js
          grep -q 'data-identity-runtime' assets/site-runtime.js
          grep -q 'main-logo' assets/identity-runtime.js
          grep -q 'data-testimonials-runtime' assets/identity-runtime.js
          grep -q 'data-marketing-runtime' assets/identity-runtime.js
          grep -q 'data-certificates-runtime' assets/identity-runtime.js
          grep -q 'data-seo-runtime' assets/identity-runtime.js
          grep -q 'LyzandraTestimonials' assets/testimonials-runtime.js
          grep -q 'aspect-ratio:9/16' assets/testimonials-runtime.js
          grep -q 'não há garantia de resultados específicos' assets/testimonials-runtime.js
          grep -q 'LyzandraCertificates' assets/certificates-runtime.js
          grep -q 'Certificação que valoriza sua formação' assets/certificates-runtime.js
          grep -q 'data-ly-certificates-benefits' assets/certificates-runtime.js
          grep -q 'LyzandraSEO' assets/seo-runtime.js
          grep -q 'google-site-verification' assets/seo-runtime.js
          grep -q 'application/ld+json' assets/seo-runtime.js
          grep -q "'@type': 'Course'" assets/seo-runtime.js
          grep -q 'HTMLRewriter' functions/index.js
          grep -q 'google-site-verification' functions/index.js
          grep -q 'application/ld+json' functions/index.js
          grep -q "'@type': 'Course'" functions/index.js
          grep -q 'X-Robots-Tag' functions/index.js
          grep -q 'connect.facebook.net' assets/marketing-runtime.js
          grep -q 'googletagmanager.com/gtag/js' assets/marketing-runtime.js
          grep -q 'googletagmanager.com/gtm.js' assets/marketing-runtime.js
          grep -q 'ad_user_data' assets/marketing-runtime.js
          grep -q 'ad_personalization' assets/marketing-runtime.js
          grep -q 'checkout_click' assets/marketing-runtime.js
          grep -q 'utm_campaign' assets/marketing-runtime.js
          grep -q 'gclid' assets/marketing-runtime.js
          grep -q 'Gerenciar cookies' assets/marketing-runtime.js
          ! grep -q "metaStandardEvent('InitiateCheckout'" assets/marketing-runtime.js
          ! grep -q "pushEvent('begin_checkout'" assets/marketing-runtime.js
          grep -q 'MAX_FAILURES = 5' src/login-rate-limit.js
          grep -q 'BASE_BLOCK_MS = 15' src/login-rate-limit.js
          grep -q 'CF-Connecting-IP' src/login-rate-limit.js
          grep -q 'security:admin-login:' src/login-rate-limit.js
          grep -q '429' functions/api/login.js
          grep -q 'Retry-After' functions/api/login.js
          grep -q 'registerLoginFailure' functions/api/login.js
          grep -q 'Sitemap:' functions/robots.txt.js
          grep -q 'Disallow: /admin/' functions/robots.txt.js
          grep -q '<urlset' functions/sitemap.xml.js
          grep -q '"/"' _routes.json
          grep -q '/robots.txt' _routes.json
          grep -q '/sitemap.xml' _routes.json
          grep -q 'X-Robots-Tag: noindex' _headers
          test -f privacidade.html
          test -f termos.html
          grep -q 'Política de Privacidade' privacidade.html
          grep -q 'Termos de Uso' termos.html
          grep -q 'www.tiktok.com/player/v1' assets/site-runtime.js
          grep -q 'quality=1080p&max_quality=4k' assets/site-runtime.js
